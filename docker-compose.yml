# SaveVault Server — Docker-Compose-Vorlage (Zielumgebung: Unraid)
#   1) (optional) cp .env.example .env  und Port/Datenpfad anpassen
#   2) den Host-Pfad unter volumes auf ein Unraid-Array-Share zeigen lassen
#   3) docker compose up -d
#   4) Dashboard öffnen und beim ersten Aufruf Benutzer + Passwort anlegen
services:
  savevault-server:
    build: .
    image: savevault-server:latest
    container_name: savevault-server
    restart: unless-stopped
    environment:
      # Kein Server-Token mehr: die Anmeldung wird als Konto im Dashboard eingerichtet.
      # Einzige Port-Quelle: der Server bindet selbst http://0.0.0.0:$SAVEVAULT_PORT.
      SAVEVAULT_PORT: ${SAVEVAULT_PORT:-8420}
      SAVEVAULT_DATA: /data/savevault
    ports:
      - "${SAVEVAULT_PORT:-8420}:${SAVEVAULT_PORT:-8420}"
    volumes:
      # links: Host-Pfad (Unraid-Share) — rechts: Pfad im Container
      - ./data:/data/savevault
