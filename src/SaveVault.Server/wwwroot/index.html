<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaveVault</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0e1116; color: #e6e9ee;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      max-width: 30rem; padding: 2rem 2.25rem; border-radius: 16px;
      background: #151a21; border: 1px solid #232a34;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    .accent { color: oklch(0.68 0.075 195); }
    p { margin: .4rem 0; line-height: 1.5; color: #aeb6c2; }
    code { background: #0e1116; padding: .1rem .35rem; border-radius: 6px; color: #e6e9ee; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="accent">SaveVault</span> Server läuft</h1>
    <p>Die JSON-API ist unter <code>/api</code> erreichbar; der Gesundheits-Check unter
       <code>/health</code>.</p>
    <p>Das eigentliche Web-Dashboard (dunkles Design) wird in Bau-Schritt 4 hier
       ausgeliefert. Dieser Platzhalter stellt nur sicher, dass die statische
       Auslieferung eingerichtet ist.</p>
  </div>
</body>
</html>
