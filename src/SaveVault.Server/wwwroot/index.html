<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaveVault</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Anmelde-/Zustands-Tor (Token-Eingabe, „nicht eingerichtet", Fehler) -->
  <div id="gate" class="gate" hidden></div>

  <!-- Eigentliches Dashboard -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__logo" id="brand-logo" aria-hidden="true"></div>
        <div class="brand__name">SaveVault</div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="topbar__title" id="view-title">Dashboard</div>
          <div class="topbar__subtitle" id="view-subtitle"></div>
        </div>
        <div class="topbar__actions">
          <div class="search">
            <span class="search__icon" id="search-icon" aria-hidden="true"></span>
            <input id="search-input" type="text" placeholder="Spiele oder Clients suchen…"
                   autocomplete="off" spellcheck="false" aria-label="Suche" />
          </div>
          <button class="icon-btn" id="refresh-btn" type="button" title="Aktualisieren" aria-label="Aktualisieren">
            <span class="icon-btn__glyph" id="refresh-glyph" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section id="view-root"></section>
    </main>
  </div>

  <!-- Einhängepunkte für Drawer / Modal / Toast -->
  <div id="overlay-root"></div>
  <div id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
