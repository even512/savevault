name: Docker-Image veröffentlichen

# Baut das SaveVault-Server-Image (linux/amd64, Unraid-tauglich) und pusht es zu Docker Hub.
# Voraussetzungen (im GitHub-Repo unter Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  – dein Docker-Hub-Benutzername
#   DOCKERHUB_TOKEN     – ein Docker-Hub Access Token (nicht das Passwort)
# Ergebnis-Image:  <DOCKERHUB_USERNAME>/savevault-server:latest  (+ Versions-Tags bei v*-Tags)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/savevault-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
