<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onOpenClick }}" style="background:oklch(0.23 0.018 280);border:1px solid oklch(0.3 0.02 280 / 0.6);border-radius:12px;padding:{{ padding }};cursor:pointer;display:flex;align-items:center;gap:{{ gap }};transition:transform .15s,border-color .15s" style-hover="transform:translateY(-2px);border-color:oklch(0.45 0.02 280)">
  <div style="width:{{ coverW }};height:{{ coverH }};flex:0 0 auto;border-radius:6px;overflow:hidden;background:linear-gradient(150deg, {{ g.coverColor }}, oklch(0.2 0.015 280))">
  </div>
  <div style="min-width:0;flex:1 1 auto">
    <div style="font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.name }}</div>
    <div style="font-size:11.5px;color:oklch(0.58 0.02 280);margin-top:2px">{{ g.platform }} · {{ g.size }} · {{ g.lastSync }}</div>
    <div onClick="{{ onStatusClick }}" style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:{{ g.statusColor }};margin-top:6px;cursor:pointer" style-hover="text-decoration:underline">
      <div style="width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:{{ g.statusColor }};animation:{{ g.pulseAnim }}"></div>
      {{ g.statusLabel }}
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;g&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;big&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const g = this.props.g || {};
    const big = !!this.props.big;
    return {
      g,
      padding: big ? "12px" : "10px",
      gap: big ? "12px" : "10px",
      coverW: big ? "44px" : "38px",
      coverH: big ? "58px" : "50px",
      onOpenClick: () => { if (this.props.onOpen) this.props.onOpen(g.idx); },
      onStatusClick: e => { e.stopPropagation(); if (g.onStatusClick) g.onStatusClick(); }
    };
  }
}

</script>
</body>
</html>
